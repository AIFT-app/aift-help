# =============================================================================
# Build the help centre and publish it to GitHub Pages (help.aifinance.team).
#
# TWO jobs, on purpose. PRD: help-deploy-race (aift-ops/specs/help-deploy-race.md)
#
#   build    checks out, builds the static export, uploads it as the
#            `github-pages` artifact.
#   deploy   needs build, and only hands that artifact to GitHub Pages.
#
# Until 2026-11-22 this was ONE job. `deploy-pages` started in the same second
# the upload ended, asked GitHub once for the run's artifacts, and does not
# retry. When that list lagged it found nothing and the check went red:
#
#   Error: No artifacts named "github-pages" were found for this workflow run.
#
# (merge e11ecd62 on 2026-11-20, not noticed for two days, and merge 05c06fa1
# on 2026-11-22). A second job starts seconds after the upload, not in the same
# second. This is the layout of GitHub's own Pages starter workflows.
#
# ── The publishing job is NAMED `deploy`. Keep the name. ─────────────────────
# Promote chains wait for a check called exactly `deploy` on the merge commit.
# A red `build` leaves `deploy` skipped, never green.
#
# ── When `deploy` is red ─────────────────────────────────────────────────────
#   "Re-run failed jobs" runs `deploy` alone, against the artifact `build`
#   already uploaded. That is the repair.
#
#   "Re-run all jobs" uploads a SECOND `github-pages` artifact into the same
#   run, and `deploy-pages` then refuses with "Multiple artifacts named
#   "github-pages" were unexpectedly found". For a clean start use a fresh run:
#
#     gh workflow run deploy.yml --repo AIFT-app/aift-help --ref main
#
#   Only `main` can publish: the `github-pages` environment refuses every
#   other branch, so a run started from one stops at `deploy`.
#
# ── Permissions are per job ──────────────────────────────────────────────────
# aift-help is PUBLIC. Only `deploy` may write to Pages and mint the OIDC
# token; `build`, the job that runs npm, can only read the repository. Every
# action is pinned to a full commit SHA
# (aift-ops/tests/help-ci-trust-boundary.test.ts §2). The shape of this
# file is guarded by aift-ops/tests/help-deploy-race.test.ts.
#
# ── Action versions: the Node 24 releases ────────────────────────────────────
# PRD: help-actions-node24 (aift-ops/specs/help-actions-node24.md). Until
# 2026-11-24 these were the Node 20 builds, which the runner forced onto
# Node 24 with a deprecation note on every run. Each pin carries its exact
# version, and this repository has ONE pin per action across its workflows
# (aift-ops/tests/help-actions-node24.test.ts).
#
#   upload-pages-artifact v4 and later leave every file and directory whose
#   name starts with a dot OUT of the published site. `out/` has none today.
#   The day one is needed on the live site (`public/.well-known/...`), add
#   `include-hidden-files: true` to the upload step in the same PR; without
#   it the file is dropped and nothing goes red.
#
#   That action also carries its own pin of `actions/upload-artifact` (by SHA
#   since v4; v3 called it by a tag anybody upstream could move).
#
#   `node-version` is the Node that runs `npm ci` and `next build`, not the
#   one the actions run on. Node 20 reached its end of life on 2026-04-30.
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the deployment
      id-token: write   # prove to Pages which workflow is deploying
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
