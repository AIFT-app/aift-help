# Catalyst drift check — aift-help side
#
# aift-web is the source of truth for Catalyst UI components. aift-help mirrors
# a copy in src/components/catalyst/ plus one shared hook. This job enforces
# that the mirror has not been edited locally.
#
# ─────────────────────────────────────────────────────────────────────────────
# NO SECRET IS REQUIRED, AND THAT IS THE POINT.
#
# This workflow used to check out the PRIVATE AIFT-app/aift-web using a
# fine-grained PAT held as `AIFT_WEB_READ_TOKEN` — a secret configured on THIS
# PUBLIC REPOSITORY. GitHub's own guidance is explicit that anyone with write
# access to a repository can obtain its secrets by modifying workflow
# behaviour, so a documentation contributor, or a compromised third-party
# action, was one edit away from reading private production source.
#
# It now verifies against a committed manifest of sha256 hashes
# (src/components/catalyst/.catalyst-manifest.json, written by
# aift-ops/scripts/sync-catalyst-to-help.sh). No private checkout, no token.
#
# The other direction — drift introduced in aift-web — is covered by
# aift-web/.github/workflows/catalyst-source-check.yml, which checks out THIS
# repo (public, no credential) and verifies its own source against the same
# manifest. Neither side can pass alone by tampering: editing a component here
# and updating the manifest to match makes the aift-web side fail, because the
# manifest then no longer describes aift-web.
#
# ⚠️ `AIFT_WEB_READ_TOKEN` should be DELETED from this repository's secrets and
#    revoked at GitHub once this has run green. Nothing reads it any more, but
#    an unused credential on a public repo is still a credential on a public
#    repo. That is an operator step — see specs/help-ci-trust-boundary.md §5.
#
# Actions are pinned to full commit SHAs, not tags: a tag is mutable and can be
# repointed at new code by whoever controls the action repo.
#
# PRD: aift-ops/specs/help-ci-trust-boundary.md
# ─────────────────────────────────────────────────────────────────────────────

name: catalyst-drift-check

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/components/catalyst/**'
      - 'src/hooks/useSidebarState.ts'
      - 'scripts/verify-catalyst-manifest.mjs'
      - '.github/workflows/catalyst-drift-check.yml'
  push:
    branches: [staging, main]
    paths:
      - 'src/components/catalyst/**'
      - 'src/hooks/useSidebarState.ts'
      - 'scripts/verify-catalyst-manifest.mjs'

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aift-help
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Deliberately NOT using actions/setup-node. The runner ships a modern
      # node, the verifier is dependency-free, and every third-party action in
      # a workflow is another party who could read whatever it can reach. This
      # workflow is the one that used to hold a private-repo token; keeping its
      # action surface to a single pinned checkout is part of the fix.
      - name: Verify the mirror against the manifest
        run: node scripts/verify-catalyst-manifest.mjs --root . --side help
